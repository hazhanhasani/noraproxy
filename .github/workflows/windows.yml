name: NoraProxy Windows Desktop Preview

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "desktop/windows/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows desktop shell
        shell: pwsh
        run: dotnet build desktop/windows/NoraProxy.Windows/NoraProxy.Windows.csproj -c Release --nologo
      - name: Run offline-import and DPAPI protection checks
        shell: pwsh
        run: dotnet run --project desktop/windows/NoraProxy.Windows.Tests/NoraProxy.Windows.Tests.csproj -c Release
      - name: Publish standalone Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish desktop/windows/NoraProxy.Windows/NoraProxy.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false -o out/windows/win-x64
          if (!(Test-Path 'out/windows/win-x64/NoraProxy.exe')) { throw 'Windows executable not found' }
          @'
          NoraProxy Windows Preview 0.1.0
          IMPORTANT: This is a Windows desktop shell and encrypted subscription manager.
          It is NOT a working VPN. Connecting is intentionally disabled until the
          native Windows Xray/TUN engine is implemented, security-reviewed and tested.
          '@ | Set-Content -Encoding utf8 'out/windows/win-x64/READ-ME-FIRST.txt'
          Compress-Archive -Path 'out/windows/win-x64/*' -DestinationPath 'out/NoraProxy-Windows-Preview-win-x64.zip'
      - name: Upload unsigned preview artifact (not official release)
        uses: actions/upload-artifact@v4
        with:
          name: NoraProxy-Windows-Preview-win-x64
          path: out/NoraProxy-Windows-Preview-win-x64.zip
          if-no-files-found: error
          retention-days: 14

