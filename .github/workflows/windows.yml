name: NoraProxy Windows Desktop & Installer

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "desktop/windows/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-preview:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 10 LTS
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows desktop shell
        shell: pwsh
        run: dotnet build desktop/windows/NoraProxy.Windows/NoraProxy.Windows.csproj -c Release --nologo
      - name: Run offline-import and DPAPI protection checks
        shell: pwsh
        run: dotnet run --project desktop/windows/NoraProxy.Windows.Tests/NoraProxy.Windows.Tests.csproj -c Release
      - name: Publish standalone Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish desktop/windows/NoraProxy.Windows/NoraProxy.Windows.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true `
            -p:PublishTrimmed=false -o out/windows/win-x64
          if (!(Test-Path 'out/windows/win-x64/NoraProxy.exe')) { throw 'Windows executable not found' }
          @'
          NoraProxy Windows Preview 0.1.1
          IMPORTANT: This is a Windows desktop shell and encrypted subscription manager.
          It is NOT a working VPN. Connecting is intentionally disabled until the
          native Windows Xray/TUN engine is implemented, security-reviewed and tested.
          '@ | Set-Content -Encoding utf8 'out/windows/win-x64/READ-ME-FIRST.txt'
          Compress-Archive -Path 'out/windows/win-x64/*' -DestinationPath 'out/NoraProxy-Windows-Preview-win-x64.zip'
      - name: Build a Windows per-user installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $possible = @(
            (Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'),
            (Join-Path $programFilesX86 'Inno Setup 7\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          )
          $iscc = $possible | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup.' }
            $iscc = $possible | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler ISCC.exe missing.' }
          $output = Join-Path (Get-Location) 'out\windows\installer'
          New-Item -Path $output -ItemType Directory -Force | Out-Null
          & $iscc /Q ("/O" + $output) 'desktop/windows/installer/NoraProxy.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $setup = Join-Path $output 'NoraProxy-Setup-0.1.1-win-x64.exe'
          if (!(Test-Path $setup)) { throw 'Installable setup EXE missing.' }
      - name: Smoke-test Windows install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path (Get-Location) 'out\windows\installer\NoraProxy-Setup-0.1.1-win-x64.exe'
          $installedDir = Join-Path $env:LOCALAPPDATA 'Programs\NoraProxy'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup returned $($install.ExitCode)" }
          if (!(Test-Path (Join-Path $installedDir 'NoraProxy.exe'))) { throw 'Installed EXE missing.' }
          $uninstaller = Join-Path $installedDir 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller missing.' }
          $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "Uninstall returned $($remove.ExitCode)" }
          if (Test-Path (Join-Path $installedDir 'NoraProxy.exe')) { throw 'App still exists after removal.' }
      - name: Upload NoraProxy installable Setup EXE (unsigned preview)
        uses: actions/upload-artifact@v4
        with:
          name: NoraProxy-Setup-0.1.1-win-x64
          path: out/windows/installer/NoraProxy-Setup-0.1.1-win-x64.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish unsigned Windows installer as distinct preview release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-preview-v0.1.1'
          $setup = 'out/windows/installer/NoraProxy-Setup-0.1.1-win-x64.exe'
          if (!(Test-Path $setup)) { throw 'Setup missing' }
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$setup.sha256"
          "$hash  NoraProxy-Setup-0.1.1-win-x64.exe" | Set-Content -Path $checksum -Encoding ascii
          $notesFile = Join-Path $env:RUNNER_TEMP 'nora-win-notes.md'
          @'
          NoraProxy Windows Preview 0.1.1 (unsigned)
          IMPORTANT: This is an installable desktop UI and encrypted subscription
          manager. It is NOT YET A WORKING VPN and Connect remains disabled.
          Native Windows Xray/TUN support, DNS/leak protection and connection tests
          must be implemented before a functional VPN can be released.

          The per-user setup includes .NET 10, Start Menu and uninstallation.
          Windows 10/11 x64. No administrator rights required. Data is preserved.
          This Windows pre-release is separate from Android OTA versions.
          Windows SmartScreen may warn because the EXE is not code-signed.
          Verify the accompanying SHA-256 checksum.
          '@ | Set-Content -Path $notesFile -Encoding utf8
          $existing = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect releases' }
          if ($existing.Count -eq 0) {
            gh release create $tag $setup $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'NoraProxy Windows Preview 0.1.1 (NOT VPN)' --notes-file $notesFile --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Failed to publish preview installer' }
          } else {
            Write-Host 'Windows preview release already exists; keeping original assets.'
          }

      - name: Upload portable ZIP for comparison
        uses: actions/upload-artifact@v4
        with:
          name: NoraProxy-Windows-Preview-win-x64
          path: out/NoraProxy-Windows-Preview-win-x64.zip
          if-no-files-found: error
          retention-days: 14

