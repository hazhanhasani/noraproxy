name: One-time NoraProxy Banner Import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-nora-banner-once.yml"

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'ci(ads): import user-provided NoraProxy banner'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare PIL
        run: python3 -m pip install --quiet Pillow
      - name: Import full resolution campaign banner
        run: |
          python3 - <<'PY'
            from PIL import Image
            from io import BytesIO
            from urllib.request import Request, urlopen
            from urllib.error import HTTPError, URLError
            from pathlib import Path
            import hashlib, json
            
            thumbnail = "https://media.canva.com/v2/image-resize/format:PNG/height:53/quality:100/uri:ifs%3A%2F%2FM%2F7d0c0cfe-814a-40ae-875c-3963fef22dd4/watermark:F/width:199?csig=AAAAAAAAAAAAAAAAAAAAAGRS9koxUn5xkCrmYN5ZhO6ij2TJnpR6Txd_iPOq-8xF&exp=1793831135&osig=AAAAAAAAAAAAAAAAAAAAADylRJxM03bdNYzDy_J-GrgibTpeBR8FE93ellT_YQMo&signer=media-rpc&token=AAIAAU0AJDdkMGMwY2ZlLTgxNGEtNDBhZS04NzVjLTM5NjNmZWYyMmRkNAAAAAABoaiq5xiJctTy6JLoQ5ZIN1hAgW-jrA1lrylSUkz8y0Vz603nGw&x-canva-quality=thumbnail"
            candidates = [
                ("full-original", thumbnail.replace("height:53", "height:648").replace("width:199", "width:2428")),
                ("full-1200", thumbnail.replace("height:53", "height:320").replace("width:199", "width:1200")),
                ("full-900", thumbnail.replace("height:53", "height:240").replace("width:199", "width:900")),
                ("thumbnail", thumbnail)
            ]
            result = None
            for tag, url in candidates:
                try:
                    with urlopen(Request(url, headers={"User-Agent":"Mozilla/5.0 NoraProxy-GitHub-Asset-Transfer"}), timeout=25) as response:
                        image_bytes = response.read(6_000_000)
                    source = Image.open(BytesIO(image_bytes))
                    print(f"Media candidate {tag}: {source.width}x{source.height}, {len(image_bytes)} bytes")
                    if source.width >= 900 and source.height >= 240:
                        result = source.convert("RGB")
                        break
                except Exception as exc:
                    print(f"Candidate {tag} unavailable: {type(exc).__name__}: {str(exc)[:150]}")
            
            if result is None:
                raise SystemExit("No full resolution source supplied by CDN. Leave previous ads unchanged.")
            
            result = result.resize((1200,320), Image.Resampling.LANCZOS)
            directory = Path("assets/ads")
            destination = directory / "noraproxy-universal-v2ray.webp"
            result.save(destination, "WEBP", quality=74, method=6)
            blob = destination.read_bytes()
            assert len(blob) < 2_000_000, "Banner exceeds Android 2MB cache limit"
            git_sha = hashlib.sha1(b"blob "+str(len(blob)).encode()+b"\x00"+blob).hexdigest()
            for old in directory.iterdir():
                if old.is_file() and old.name != destination.name and old.suffix.lower() in (".png",".webp",".jpg",".jpeg"):
                    old.unlink()
            manifest_path = directory/"manifest.json"
            manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
            assert manifest["version"] == 1
            manifest["enabled"] = True
            manifest["banners"] = [{
              "id":"noraproxy-universal-v2ray",
              "file":destination.name,
              "sha":git_sha,
              "title":"NoraProxy - اتصال به انواع کانفیگ و اشتراک V2Ray",
              "enabled":True
            }]
            manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
            print(f"Prepared sole banner {destination} ({len(blob)} bytes) with Git blob SHA {git_sha}")
          PY
      - name: Atomically publish only the new ad
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::Main branch moved during media import; no destructive publication"
            exit 1
          fi
          git add -A assets/ads
          git diff --cached --stat
          git commit -m "feat(ads): replace old campaigns with NoraProxy universal V2Ray banner"
          git push origin HEAD:main
