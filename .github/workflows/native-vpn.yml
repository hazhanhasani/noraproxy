name: Build NoraProxy Native VPN

on:
  push:
    branches: [main, feat/native-xray-vpn]
    paths:
      - "native-vpn/**"
      - "scripts/prepare_native_vpn.py"
      - "scripts/enable_release_signing.py"
      - "scripts/telegram_release.py"
      - "scripts/post_telegram_release.sh"
      - "release-notes/**"
      - "tests/test_telegram_release.py"
      - ".github/workflows/native-vpn.yml"
      - "app/src/main/res/drawable/ic_launcher.xml"
  pull_request:
    paths:
      - "native-vpn/**"
      - "scripts/prepare_native_vpn.py"
      - ".github/workflows/native-vpn.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nora-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout NoraProxy
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Telegram publishing scripts, caption and checksum rules
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_telegram_release.py' -v
          python3 -m py_compile scripts/telegram_release.py
          bash -n scripts/post_telegram_release.sh

      - name: Checkout pinned official v2rayNG runtime and native submodules
        uses: actions/checkout@v4
        with:
          repository: 2dust/v2rayNG
          ref: 9fcb1a30f81345920f9609029ae923b4ea0a866c
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install native Android NDK
        shell: bash
        run: |
          set -euo pipefail
          MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$MANAGER"
          echo y | "$MANAGER" --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Restore native hev-tunnel cache
        uses: actions/cache@v4
        id: hev
        with:
          path: upstream/libs
          key: noraproxy-hevtun-2.3.5-ndk29-v1

      - name: Build native hev tunnel
        if: steps.hev.outputs.cache-hit != 'true'
        working-directory: upstream
        run: bash compile-hevtun.sh

      - name: Stage native tunnel binaries
        run: |
          mkdir -p upstream/V2rayNG/app/libs
          cp -r upstream/libs/. upstream/V2rayNG/app/libs/

      - name: Resolve upstream Xray AAR release version
        id: xray
        working-directory: upstream/AndroidLibXrayLite
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          TAG="$(git describe --tags --abbrev=0)"
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore original libv2ray AAR cache
        id: aar
        uses: actions/cache@v4
        with:
          path: upstream/V2rayNG/app/libs/libv2ray.aar
          key: noraproxy-libv2ray-${{ steps.xray.outputs.tag }}

      - name: Download upstream native Xray library
        if: steps.aar.outputs.cache-hit != 'true'
        env:
          TAG: ${{ steps.xray.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEST="upstream/V2rayNG/app/libs/libv2ray.aar"
          curl -fLSs --connect-timeout 20 --max-time 300 --retry 4 --retry-all-errors \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/$TAG/libv2ray.aar" \
            -o "$DEST" || gh release download "$TAG" -R 2dust/AndroidLibXrayLite \
            -p libv2ray.aar -D upstream/V2rayNG/app/libs --clobber
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          p=Path("upstream/V2rayNG/app/libs/libv2ray.aar")
          assert p.stat().st_size>1_000_000
          with ZipFile(p) as z:
              assert z.testzip() is None
          PY

      - name: Apply NoraProxy standalone VPN overlay
        # This is the ONLY step that generates BuildConfig and the
        # Tapsell manifest placeholder; pass IDs here, not to Gradle.
        env:
          NORA_TAPSELL_APP_ID: ${{ secrets.NORA_TAPSELL_APP_ID }}
          NORA_TAPSELL_INTERSTITIAL_ZONE_ID: ${{ secrets.NORA_TAPSELL_INTERSTITIAL_ZONE_ID }}
          NORA_REQUIRE_TAPSELL: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: python3 scripts/prepare_native_vpn.py

      - name: Read actual Android version for signing and OTA
        id: nora_version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path
          gradle = Path("upstream/V2rayNG/app/build.gradle.kts").read_text(encoding="utf-8")
          version = re.search(r'^\s*versionName\s*=\s*"(\d+\.\d+\.\d+)"', gradle, re.M)
          code = re.search(r'^\s*versionCode\s*=\s*(\d+)', gradle, re.M)
          assert version is not None and code is not None, "Gradle version information missing"
          assert 'applicationId = "app.noraproxy"' in gradle, "Unexpected Android package ID"
          assert int(code.group(1)) > 0, "Android version code must be positive"
          print("version=" + version.group(1))
          print("tag=v" + version.group(1))
          print("apk_filename=NoraProxy-" + version.group(1) + ".apk")
          PY
          echo "Android package version derived directly from signed build inputs."

      - name: Validate NoraProxy label and crash-safe resource overlay
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="upstream/V2rayNG/app/src/main/AndroidManifest.xml"
          MAIN="upstream/V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainScreen.kt"
          grep -q 'android:label="NoraProxy"' "$MANIFEST"
          grep -q 'navigationBarsPadding()' "$MAIN"
          grep -q 'WindowInsets.safeDrawing' "$MAIN"
          ! grep -q 'painterResource(R.drawable.nora_wordmark)' "$MAIN"
          grep -q 'painterResource(R.drawable.nora_brand)' "$MAIN"
          grep -q 'onAction(MainAction.SelectServer(route.guid))' "$MAIN"
          grep -q 'chooseRoute(country, country.countryCode)' "$MAIN"
          grep -q 'preferred_country' "$MAIN"
          ! grep -q 'painterResource(R.drawable.nora_launcher)' "$MAIN"
          # Home must never use a scrollable LazyColumn, even on small phones.
          grep -q 'if (tab == NoraTab.Home)' "$MAIN"
          grep -q 'NoraHomeContent(' "$MAIN"
          grep -q 'BoxWithConstraints(' "$MAIN"
          grep -q '.clip(CircleShape) // Prevent square ripple artifacts on tap.' "$MAIN"
          grep -q 'powerPending' "$MAIN"
          grep -q 'tapsell.onVpnOperationCompleted()' "$MAIN"
          test -f upstream/V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/NoraTapsellAds.kt
          grep -q NORA_TAPSELL_ENABLED upstream/V2rayNG/app/build.gradle.kts
          grep -q ir.tapsell.mediation.AUTO_INIT upstream/V2rayNG/app/src/main/AndroidManifest.xml
          # BuildConfig is generated at overlay time. Do not publish an
          # apparently monetized version that quietly has ads disabled.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            grep -Fq 'buildConfigField("boolean", "NORA_TAPSELL_ENABLED", "true")' upstream/V2rayNG/app/build.gradle.kts ||
              { echo "::error::Tapsell is disabled in the compiled app despite configured Secrets."; exit 1; }
          fi
          INSTALLER="upstream/V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/NoraUpdater.kt"
          RESULT="upstream/V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/NoraInstallResultActivity.kt"
          grep -q 'packageInstaller' "$INSTALLER"
          grep -q 'session.openWrite("base.apk"' "$INSTALLER"
          grep -q 'PendingIntent.FLAG_MUTABLE' "$INSTALLER"
          grep -q 'STATUS_PENDING_USER_ACTION' "$RESULT"
          grep -q 'NoraInstallResultActivity' "$MANIFEST"
          if grep -q 'Intent.ACTION_VIEW' "$INSTALLER"; then
            echo "::error::Legacy MIUI FileProvider APK installer must not return"
            exit 1
          fi
          ! grep -q 'v2rayNG_' upstream/V2rayNG/app/build.gradle.kts
          if grep -R -F '<string name="app_name" translatable="false">v2rayNG</string>' upstream/V2rayNG/app/src/main/res/values*; then
            echo "::error::Localized launcher label still references v2rayNG"
            exit 1
          fi
          for icon in home locations subscription settings; do
            test -f "upstream/V2rayNG/app/src/main/res/drawable/nora_tab_$icon.xml"
          done
          echo "NoraProxy launcher title, safe areas, stable vector icons, and crash guard OK"

      - name: Build NoraProxy Android APK
        working-directory: upstream/V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assemblePlaystoreDebug

      - name: Run NoraProxy subscription metadata unit tests
        working-directory: upstream/V2rayNG
        run: ./gradlew --no-daemon :app:testPlaystoreDebugUnitTest --tests com.v2ray.ang.ui.main.NoraSubscriptionUsageTest

      - name: Upload standalone NoraProxy VPN APK
        uses: actions/upload-artifact@v4
        with:
          name: NoraProxy-Native-VPN-Debug
          path: upstream/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Require the permanent signing secrets
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          NORA_KEYSTORE_BASE64: ${{ secrets.NORA_KEYSTORE_BASE64 }}
          NORA_SIGNING_STORE_PASSWORD: ${{ secrets.NORA_SIGNING_STORE_PASSWORD }}
          NORA_SIGNING_KEY_ALIAS: ${{ secrets.NORA_SIGNING_KEY_ALIAS }}
          NORA_SIGNING_KEY_PASSWORD: ${{ secrets.NORA_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in NORA_KEYSTORE_BASE64 NORA_SIGNING_STORE_PASSWORD NORA_SIGNING_KEY_ALIAS NORA_SIGNING_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Permanent NoraProxy signing secret '$key' is missing; refusing to produce release."
              exit 1
            fi
          done
          printf '%s' "$NORA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nora-release.jks"
          chmod 600 "$RUNNER_TEMP/nora-release.jks"
          echo "NORA_SIGNING_STORE_FILE=$RUNNER_TEMP/nora-release.jks" >> "$GITHUB_ENV"

      - name: Configure permanent APK signing
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          NORA_SIGNING_STORE_PASSWORD: ${{ secrets.NORA_SIGNING_STORE_PASSWORD }}
          NORA_SIGNING_KEY_ALIAS: ${{ secrets.NORA_SIGNING_KEY_ALIAS }}
          NORA_SIGNING_KEY_PASSWORD: ${{ secrets.NORA_SIGNING_KEY_PASSWORD }}
        run: python3 scripts/enable_release_signing.py

      - name: Build fixed-signature release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        working-directory: upstream/V2rayNG
        env:
          NORA_SIGNING_STORE_PASSWORD: ${{ secrets.NORA_SIGNING_STORE_PASSWORD }}
          NORA_SIGNING_KEY_ALIAS: ${{ secrets.NORA_SIGNING_KEY_ALIAS }}
          NORA_SIGNING_KEY_PASSWORD: ${{ secrets.NORA_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assemblePlaystoreRelease

      - name: Verify release package, signature and SHA256
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="upstream/V2rayNG/app/build/outputs/apk/playstore/release"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          EXPECTED="248e68eda1329080c3d05252392c585996b014280c4a380411b0cb3e88ee9a8a"
          test -x "$APKSIGNER"
          mapfile -d '' APKS < <(find "$OUTPUT" -maxdepth 1 -type f -name '*.apk' -print0 | sort -z)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No release APK files found"
            exit 1
          fi
          UNIVERSAL=""
          for APK in "${APKS[@]}"; do
            test -s "$APK"
            "$APKSIGNER" verify --verbose "$APK" >/dev/null
            CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
            CERT="$(printf '%s\n' "$CERT_OUTPUT" |
              sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([a-fA-F0-9:]+)[[:space:]]*$/\1/p' |
              head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$CERT" ]; then
              echo "::error::Unable to parse certificate SHA-256 from apksigner for $(basename "$APK")"
              printf '%s\n' "$CERT_OUTPUT" | grep 'certificate SHA-256 digest' || true
              exit 1
            fi
            # Certificate digests are PUBLIC metadata; NEVER log private keystores or passwords.
            echo "APK $(basename "$APK") signed with certificate SHA256=$CERT"
            if [ "$CERT" != "$EXPECTED" ]; then
              echo "::error::Release APK signer mismatch (expected $EXPECTED; got $CERT)"
              exit 1
            fi
            case "$(basename "$APK")" in
              *universal.apk) UNIVERSAL="$APK" ;;
            esac
          done
          if [ -z "$UNIVERSAL" ]; then
            echo "::error::No verified universal APK was produced"
            exit 1
          fi
          mkdir -p signed
          VERSION="${{ steps.nora_version.outputs.version }}"
          cp "$UNIVERSAL" "signed/NoraProxy-$VERSION.apk"
          (cd signed && sha256sum "NoraProxy-$VERSION.apk" > "NoraProxy-$VERSION.apk.sha256")
          echo "All release APK signatures and fixed NoraProxy certificate verified."

      - name: Upload fixed-signature release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: NoraProxy-Signed-Release-${{ steps.nora_version.outputs.version }}
          path: signed/
          if-no-files-found: error
          retention-days: 90

      - name: Automatically publish verified new release for in-app updates
        id: publish_release
        # This step runs ONLY after APK build, signature verification and SHA256
        # preparation have succeeded. Never publish from feature branches or PRs.
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NORA_VERSION: ${{ steps.nora_version.outputs.version }}
          NORA_TAG: ${{ steps.nora_version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          APK="signed/NoraProxy-$NORA_VERSION.apk"
          CHECKSUM="$APK.sha256"
          test -s "$APK"
          test -s "$CHECKSUM"
          (cd signed && sha256sum --check "NoraProxy-$NORA_VERSION.apk.sha256")

          # Never replace an existing published APK (stable content/version).
          # Subsequent pushes without a version bump are successful no-ops.
          if gh release view "$NORA_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $NORA_TAG already exists. Preserving its original signed APK."
            exit 0
          fi

          # Reject publication of an older version after a newer stable release.
          PUBLISHED_TAGS="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName')"
          export PUBLISHED_TAGS NORA_VERSION
          python3 - <<'PY'
          import os, re
          current = tuple(map(int, os.environ["NORA_VERSION"].split(".")))
          for tag in os.environ.get("PUBLISHED_TAGS", "").splitlines():
              if re.fullmatch(r"v\d+\.\d+\.\d+", tag):
                  published = tuple(map(int, tag[1:].split(".")))
                  if published >= current:
                      raise SystemExit("Refusing OTA release older than a published version: " + tag)
          PY

          gh release create "$NORA_TAG" \
            "$APK" "$CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NoraProxy $NORA_VERSION" \
            --notes "Verified signed NoraProxy Android APK. Download and install updates inside NoraProxy; Android requires installation confirmation." \
            --latest
          echo "New signed release $NORA_TAG is now available to the Android updater."
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Post signed APK and polished Persian changelog to Telegram channel
        # Runs in this workflow because a Release created with GITHUB_TOKEN
        # does not trigger a new 'release' workflow automatically.
        if: steps.publish_release.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NORA_TG_API_ID: ${{ secrets.NORA_TG_API_ID }}
          NORA_TG_API_HASH: ${{ secrets.NORA_TG_API_HASH }}
          NORA_TG_BOT_TOKEN: ${{ secrets.NORA_TG_BOT_TOKEN }}
          NORA_TG_CHANNEL_ID: '@noraproxy'
          NORA_TG_OPTIONAL: 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/post_telegram_release.sh \
            "${{ steps.nora_version.outputs.version }}" "$GITHUB_REPOSITORY" signed

      - name: Delete signing keystore from runner
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/nora-release.jks"
